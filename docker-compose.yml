services:

  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    env_file: ./api/.env
    networks:
      - internal
    restart: unless-stopped

  dapp:
    build:
      context: ./dapp
      dockerfile: Dockerfile
    networks:
      - internal
    restart: unless-stopped

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api
      - dapp
    networks:
      - internal
    restart: unless-stopped

networks:
  internal:
    driver: bridge
