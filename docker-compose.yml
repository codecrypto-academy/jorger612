services:

  mongo:
    image: mongo:7
    ports:
      - "27019:27017"
    volumes:
      - mongo_market_data:/data/db
    networks:
      - internal
    restart: unless-stopped

  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    env_file: ./api/.env
    environment:
      PORT: "3005"
      MONGODB_URI: mongodb://mongo:27017/rbac_market
    depends_on:
      - mongo
    networks:
      - internal
    restart: unless-stopped

  dapp:
    build:
      context: ./dapp
      dockerfile: Dockerfile
    networks:
      - internal
    restart: unless-stopped

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api
      - dapp
    networks:
      - internal
    restart: unless-stopped

networks:
  internal:
    driver: bridge

volumes:
  mongo_market_data:
