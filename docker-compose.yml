# RBAC — stack para VPS (Besu puede correr aparte en el mismo host).
# Puertos publicados: 3006 (dapp), 3007 (API), 27019 (MongoDB).
#
# Antes del primer arranque:
#   1) Copie .env.example → .env en la RAÍZ (variables para el build de Next).
#   2) Copie api/.env.example → api/.env y ajuste RPC, contrato y CONTRACT_OWNER_ADDRESS.
#
# Arranque: docker compose up -d --build

services:

  mongo:
    image: mongo:7
    ports:
      - "27019:27017"
    volumes:
      - mongo_market_data:/data/db
    networks:
      - internal
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand({ ping: 1 }).ok"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 15s

  redis:
    image: redis:7-alpine
    ports:
      - "6380:6379"
    networks:
      - internal
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    env_file: ./api/.env
    ports:
      - "3007:3007"
    environment:
      PORT: "3007"
      MONGODB_URI: mongodb://mongo:27017/rbac_market
      REDIS_URL: redis://redis:6379
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - internal
    restart: unless-stopped

  dapp:
    build:
      context: ./dapp
      dockerfile: Dockerfile
      args:
        API_REWRITE_TARGET: "http://api:3007"
        RPC_URL: ${RPC_URL}
        CHAIN_ID: ${CHAIN_ID}
        CONTRACT_ADDRESS: ${CONTRACT_ADDRESS}
        CONTRACT_OWNER_ADDRESS: ${CONTRACT_OWNER_ADDRESS:-}
        CONTRACT_DEPLOY_BLOCK: ${CONTRACT_DEPLOY_BLOCK:-0}
        NETWORK_NAME: ${NETWORK_NAME:-Besu RBAC}
        CONTRACT_DISPLAY_NAME: ${CONTRACT_DISPLAY_NAME:-SecurityManager}
    ports:
      - "3006:3006"
    depends_on:
      - api
    networks:
      - internal
    restart: unless-stopped

networks:
  internal:
    driver: bridge

volumes:
  mongo_market_data:
